name: Build and release HMCL for macOS

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*-r*']

permissions:
  contents: read

jobs:
  build:
    if: github.ref_type != 'tag'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify distribution files
        run: |
          ./package.sh
          cd dist
          shasum -a 256 --check SHA256SUMS

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    runs-on: macos-15
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build and publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/github-release.sh
